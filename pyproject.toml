[project]
name = "compache"
version = "0.3.0"
description = "Compache is optimizer plugin for compacting and caching model conversations"
readme = "README.md"
authors = [
    { name = "Richard Debets", email = "rrd.technl@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
compache = "compache.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/**", "examples/rag_workload/**", "examples/rag_long/README.md", "examples/rag_long/manifest.json", "examples/rag_long/results/**", "scripts/**", "skills/**", "benchmarks/**", "tests/**"]
