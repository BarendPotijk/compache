[project]
name = "compache"
version = "0.11.0"
description = "Fit prompt caching and context compaction to your own conversation traces."
readme = "README.md"
authors = [
    { name = "Richard Debets", email = "rrd.technl@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
compache = "compache.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/**", "examples/**", "scripts/**", "skills/**", "benchmarks/**", "tests/**", "site/**"]
