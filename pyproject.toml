[project]
name = "compache"
version = "0.1.0"
description = "Compache is optimizer plugin for compacting and caching model conversations"
readme = "README.md"
authors = [
    { name = "Richard Debets", email = "rrd.technl@gmail.com" }
]
requires-python = ">=3.15.0"
dependencies = [
    "pandas>=3.1.1",
]

[project.scripts]
compache = "compache:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
