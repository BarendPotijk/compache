name: Release

# Runs when a version tag is pushed. Publishing uses PyPI's trusted publishing: no token is kept
# anywhere, and PyPI only accepts it from this workflow, in this repository, in the `pypi` environment.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check that the tag is the version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} is not version {version}"
          PY
      - name: Test
        run: |
          python -m pip install . pytest build twine
          python -m pytest -q
      - name: Spell out the README's links for PyPI
        run: python scripts/pypi_readme.py "$GITHUB_REF_NAME"
      - name: Build
        run: python -m build
      - name: Check the packages
        run: python -m twine check --strict dist/*
      - name: Install the wheel and fit the sample
        run: |
          python -m venv clean
          clean/bin/pip install dist/*.whl
          clean/bin/compache demo
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
