name: Publish calculator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/compache/models.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test calculator
        run: node --test site/*.test.mjs
      - name: Prepare website files
        run: rsync -a --exclude '*.test.mjs' site/ _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    # A job of its own: in the second after an upload the artifact is not always listed yet,
    # and a deployment that looks then finds none. Failed here, only this job is run again.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before trying once more
        if: steps.first.outcome == 'failure'
        run: sleep 30
      - name: Deploy website, second try
        id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
