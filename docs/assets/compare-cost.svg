<svg xmlns="http://www.w3.org/2000/svg" width="880" height="489" viewBox="0 0 880 489" role="img" aria-labelledby="t d">
<title id="t">Cost per 1,000 turns of document chats: other tools against compache</title>
<desc id="d">DocChat&#x27;s held-out chats on Claude Sonnet 5.5. Users back after 30 seconds: Whole history, default cache $34, Headroom, target ratio 0.5 $24, Kompressor $29, Whole history, cache kept warm $28, compache $19. Users back after 4 minutes: Whole history, default cache $143, Headroom, target ratio 0.5 $99, Kompressor $38, Whole history, cache kept warm $37, compache $24. Users back after 30 minutes: Whole history, default cache $286, Headroom, target ratio 0.5 $197, Kompressor $151, Whole history, cache kept warm $108, compache $43.</desc>
