<svg xmlns="http://www.w3.org/2000/svg" width="640" height="264" viewBox="0 0 640 264" role="img" aria-labelledby="oc-title oc-desc">
<title id="oc-title">Cost per 1,000 turns on Claude Sonnet 5.5: OpenClaw against compache</title>
<desc id="oc-desc">Modeled cost per 1,000 turns at three thread lengths. 8-turn threads: OpenClaw $216, compache $121; 30-turn threads: OpenClaw $257, compache $137; 80-turn threads: OpenClaw $287, compache $144.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .t { fill: #1f2328; } .s { fill: #656d76; }
  .oc { fill: #8c959f; } .cp { fill: #2a78d6; } .base { stroke: #d0d7de; }
  .head { font-size: 15px; font-weight: 600; } .sub, .key, .val { font-size: 12.5px; } .row { font-size: 13px; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; } .t { fill: #e6edf3; } .s { fill: #9198a1; }
    .oc { fill: #6e7681; } .cp { fill: #3987e5; } .base { stroke: #30363d; }
  }
</style>
<rect class="bg" width="640" height="264" rx="10"/>
<text class="t head" x="24" y="34">Cost per 1,000 turns · Claude Sonnet 5.5</text>
<text class="s sub" x="24" y="54">Modeled on the calculator's default workload, against OpenClaw's defaults.</text>
<rect class="oc" x="446" y="24" width="10" height="10" rx="2"/><text class="s key" x="462" y="33.5">OpenClaw</text>
<rect class="cp" x="538" y="24" width="10" height="10" rx="2"/><text class="s key" x="554" y="33.5">compache</text>
<line class="base" x1="132" y1="78" x2="132" y2="244"/>
<text class="t row" x="24" y="107.5">8-turn threads</text><path class="oc" d="M132 86h267.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H132z"/><path class="cp" d="M132 104h147.7a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H132z"/><text class="s val" x="411.0" y="98.5">$216</text><text class="t val" x="291.7" y="116.5"><tspan font-weight="600">$121</tspan><tspan class="s" dx="6">44% less</tspan></text>
<text class="t row" x="24" y="165.5">30-turn threads</text><path class="oc" d="M132 144h319.4a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H132z"/><path class="cp" d="M132 162h168.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H132z"/><text class="s val" x="463.4" y="156.5">$257</text><text class="t val" x="312.0" y="174.5"><tspan font-weight="600">$137</tspan><tspan class="s" dx="6">47% less</tspan></text>
<text class="t row" x="24" y="223.5">80-turn threads</text><path class="oc" d="M132 202h356.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H132z"/><path class="cp" d="M132 220h177.5a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H132z"/><text class="s val" x="500.0" y="214.5">$287</text><text class="t val" x="321.5" y="232.5"><tspan font-weight="600">$144</tspan><tspan class="s" dx="6">50% less</tspan></text>
</svg>
