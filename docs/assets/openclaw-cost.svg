<text x="24.0" y="30.0" class="big">Cost per 1,000 turns · Claude Sonnet 5.5</text>
<text x="24.0" y="49.0" class="t2">The calculator&#x27;s default workload at three thread lengths, against OpenClaw&#x27;s defaults.</text>
