<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
<title id="t">What an agent saves follows from how it is worked with</title>
<desc id="d">Cost per 1,000 model calls of sending everything and of compache, for three ways of working. One task at a stretch: everything $9.76, cached at its best $9.76, compache $9.32 with 8 rounds in full, 5-minute cache. A few steps, a 4-minute break: everything $15, cached at its best $11, compache $10 with 20 rounds in full, 3 pings. Three tasks, 4-minute breaks: everything $16, cached at its best $16, compache $12 with 12 rounds in full, 1-hour instructions.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#0b0b0b}
.surface{fill:#fcfcfb;stroke:rgba(11,11,11,.1)}
.t2{fill:#52514e}.tm{fill:#898781}.b{font-weight:600}.h{font-size:13px;font-weight:600}.big{font-size:15px;font-weight:600}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.box{fill:none;stroke:#c3c2b7}
.c{fill:#2a78d6}.cs{stroke:#2a78d6}.n{fill:#898781}.ns{stroke:#898781}.o{fill:#eb6834}.os{stroke:#eb6834}
.cell{fill:#e1e0d9}.ring{stroke:#fcfcfb;stroke-width:2}.line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arc{fill:none;stroke-width:1.75;stroke-linecap:round}
@media (prefers-color-scheme:dark){
text{fill:#f0efec}.surface{fill:#1a1a19;stroke:rgba(255,255,255,.1)}.t2{fill:#c3c2b7}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}.box{stroke:#52514e}
.c{fill:#3987e5}.cs{stroke:#3987e5}.o{fill:#d95926}.os{stroke:#d95926}
.cell{fill:#383835}.ring{stroke:#1a1a19}
}
</style>
<rect class="surface" x=".5" y=".5" width="879" height="399" rx="10"/>
<style>.n2{fill:#c3c2b7}@media (prefers-color-scheme:dark){.n2{fill:#5a5954}}</style>
<text x="24.0" y="32.0" class="big">What an agent saves follows from how it is worked with</text>
<text x="24.0" y="51.0" class="t2">Cost per 1,000 model calls on Claude Sonnet 5.5. 174 public coding-agent runs, the half compache had not seen.</text>
<rect class="n" x="24" y="66" width="10" height="10" rx="2"/>
<text x="40.0" y="75.5" class="t2">Send everything</text>
<rect class="n2" x="161.0" y="66" width="10" height="10" rx="2"/>
<text x="177.0" y="75.5" class="t2">Send everything, cached at its best</text>
<rect class="c" x="422.0" y="66" width="10" height="10" rx="2"/>
<text x="438.0" y="75.5" class="t2">compache</text>
<text x="24.0" y="108.0" class="h">One task at a stretch</text>
<line class="axis" x1="24.0" x2="190.0" y1="348" y2="348"/>
<path class="n" d="M24.0,348 v-116.2 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v116.2 z"/>
<text x="47.0" y="219.8" class="t2" text-anchor="middle">$9.76</text>
<path class="n2" d="M84.0,348 v-116.2 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v116.2 z"/>
<text x="107.0" y="219.8" class="t2" text-anchor="middle">$9.76</text>
<path class="c" d="M144.0,348 v-110.7 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v110.7 z"/>
<text x="167.0" y="225.3" class="h" text-anchor="middle">$9.32</text>
<text x="204.0" y="292.0" class="h">5% less</text>
<text x="204.0" y="307.0" class="tm">than everything</text>
<text x="204.0" y="328.0" class="h">5% less</text>
<text x="204.0" y="343.0" class="tm">than cached</text>
<text x="24.0" y="368.0" class="tm">compache picked</text>
<text x="24.0" y="384.0" class="t2">8 rounds in full, 5-minute cache</text>
<text x="308.0" y="108.0" class="h">A few steps, a 4-minute break</text>
<line class="axis" x1="308.0" x2="474.0" y1="348" y2="348"/>
<path class="n" d="M308.0,348 v-175.1 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v175.1 z"/>
<text x="331.0" y="160.9" class="t2" text-anchor="middle">$15</text>
<path class="n2" d="M368.0,348 v-130.3 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v130.3 z"/>
<text x="391.0" y="205.7" class="t2" text-anchor="middle">$11</text>
<path class="c" d="M428.0,348 v-124.0 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v124.0 z"/>
<text x="451.0" y="212.0" class="h" text-anchor="middle">$10</text>
<text x="488.0" y="292.0" class="h">29% less</text>
<text x="488.0" y="307.0" class="tm">than everything</text>
<text x="488.0" y="328.0" class="h">5% less</text>
<text x="488.0" y="343.0" class="tm">than cached</text>
<text x="308.0" y="368.0" class="tm">compache picked</text>
<text x="308.0" y="384.0" class="t2">20 rounds in full, 3 pings</text>
<text x="592.0" y="108.0" class="h">Three tasks, 4-minute breaks</text>
<line class="axis" x1="592.0" x2="758.0" y1="348" y2="348"/>
<path class="n" d="M592.0,348 v-192.0 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v192.0 z"/>
<text x="615.0" y="144.0" class="t2" text-anchor="middle">$16</text>
<path class="n2" d="M652.0,348 v-189.4 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v189.4 z"/>
<text x="675.0" y="146.6" class="t2" text-anchor="middle">$16</text>
<path class="c" d="M712.0,348 v-146.3 a4,4 0 0 1 4,-4 h38 a4,4 0 0 1 4,4 v146.3 z"/>
<text x="735.0" y="189.7" class="h" text-anchor="middle">$12</text>
<text x="772.0" y="292.0" class="h">23% less</text>
<text x="772.0" y="307.0" class="tm">than everything</text>
<text x="772.0" y="328.0" class="h">22% less</text>
<text x="772.0" y="343.0" class="tm">than cached</text>
<text x="592.0" y="368.0" class="tm">compache picked</text>
<text x="592.0" y="384.0" class="t2">12 rounds in full, 1-hour instructions</text>
</svg>
