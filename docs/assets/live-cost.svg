<title id="t">What the provider billed per 1,000 turns through every way in, with and without a compache policy</title>
<desc id="d">DocChat, 5 held-out conversations of 10 to 12 turns, played at their users&#x27; pace. Billed by the providers through OpenRouter. OpenAI SDK, wrapped, Chat Completions, a search tool, Claude Haiku 5.5: no policy $2.67, default policy $1.43, fitted on past traces $1.42, fitted on the model&#x27;s notes $1.40. OpenAI SDK, wrapped, Chat Completions, passages pasted in, Claude Haiku 5.5: no policy $2.42, default policy $1.71, fitted on past traces $1.30, fitted on the model&#x27;s notes $1.24. Anthropic SDK, through the proxy, Messages, a search tool, Claude Haiku 5.5: no policy $2.90, default policy $1.52, fitted on past traces $1.54, fitted on the model&#x27;s notes $1.54. LangChain agent, its clients wrapped, Chat Completions, a search tool, Claude Haiku 5.5: no policy $2.71, default policy $1.49, fitted on past traces $1.51, fitted on the model&#x27;s notes $1.57. OpenAI SDK, wrapped, Responses, a search tool, GPT-6 Luna: no policy $0.90, default policy $0.85, fitted on past traces $0.88, fitted on the model&#x27;s notes $0.86.</desc>
