<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388" role="img" aria-labelledby="t d">
<title id="t">What one chat sends to the model, message by message</title>
<desc id="d">A 26-message chat. Sending the whole history grows to 89,285 tokens on the last message, compache sends 25,351 there. The cache had expired before 8 messages and compache trimmed the history 8 times, each time on one of those. Before 4 other messages a ping kept the cache warm.</desc>
