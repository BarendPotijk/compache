<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">compache system design and build plan</title>
  <desc id="sd-desc">The package as layers. Online: host integrations call four runtime functions, which use the pure core (gate, planner, view identity, ruler) and the provider adapters. Offline: connectors, two fitters and a solver produce the policy that the core reads. Contracts in spec/ sit under both. Each part carries the number of the build phase that creates it, from 0 Contracts to 4 Broaden.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; }
    .lane-t { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #1f2328; }
    .lane-s { font-size: 11px; fill: #656d76; }
    .row { font-size: 10px; fill: #1f2328; }
    .row-s { font-size: 10px; fill: #656d76; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.25; }
    .grp { fill: #eef1f4; stroke: #d0d7de; stroke-width: 1; }
    .ext { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 4; }
    .pill { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .t { font-size: 12.5px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
    .tl { font-size: 12.5px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 10px; fill: #656d76; text-anchor: middle; }
    .sl { font-size: 10px; fill: #656d76; }
    .a { font-size: 10.5px; fill: #1f2328; text-anchor: middle; }
    .api { font-size: 11px; fill: #1f2328; text-anchor: middle; }
    .flow { fill: none; stroke: #424a53; stroke-width: 1.4; }
    .head { fill: #424a53; }
    .policy { fill: #e1ecf9; stroke: #2a78d6; stroke-width: 2; }
    .pflow { fill: none; stroke: #2a78d6; stroke-width: 2; }
    .phead { fill: #2a78d6; }
    .tele { fill: none; stroke: #6e7781; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .thead { fill: #6e7781; }
    .bdg { fill: #1f2328; stroke: #ffffff; stroke-width: 1.5; }
    .bdg-t { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; }
      .lane-t, .row, .t, .tl, .a, .api { fill: #e6edf3; }
      .lane-s, .row-s, .s, .sl { fill: #9198a1; }
      .box { fill: #0d1117; stroke: #30363d; }
      .grp { fill: #1c2129; stroke: #30363d; }
      .ext { stroke: #6e7681; }
      .pill { fill: #0d1117; stroke: #6e7681; }
      .flow { stroke: #c9d1d9; }
      .head { fill: #c9d1d9; }
      .policy { fill: #142438; stroke: #3987e5; }
      .pflow { stroke: #3987e5; }
      .phead { fill: #3987e5; }
      .tele { stroke: #8b949e; }
      .thead { fill: #8b949e; }
      .bdg { fill: #e6edf3; stroke: #0d1117; }
      .bdg-t { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="sd-ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="sd-ahp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="phead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="sd-aht" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="thead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="640" rx="14"/>

  <!-- lanes -->
  <rect class="lane" x="8" y="8" width="552" height="484" rx="12"/>
  <text class="lane-t" x="24" y="30">ONLINE</text>
  <text class="lane-s" x="82" y="30">runs with your agent</text>
  <rect class="lane" x="596" y="8" width="296" height="484" rx="12"/>
  <text class="lane-t" x="612" y="30">OFFLINE</text>
  <text class="lane-s" x="678" y="30">CLI: compache audit · fit · solve</text>

  <!-- ONLINE: integrations -->
  <text class="row mono" x="24" y="52">integrations/</text>
  <rect class="box" x="24" y="60" width="96" height="46" rx="8"/>
  <text class="t" x="72" y="80">SDKs</text>
  <text class="s" x="72" y="95">client wrappers</text>
  <rect class="box" x="130" y="60" width="96" height="46" rx="8"/>
  <text class="t" x="178" y="80">LangChain</text>
  <text class="s" x="178" y="95">and LangGraph</text>
  <rect class="box" x="236" y="60" width="96" height="46" rx="8"/>
  <text class="t" x="284" y="80">Hermes</text>
  <text class="s" x="284" y="95">context engine</text>
  <rect class="box" x="342" y="60" width="96" height="46" rx="8"/>
  <text class="t" x="390" y="80">opencode</text>
  <text class="s" x="390" y="95">plugin + service</text>
  <rect class="box" x="448" y="60" width="96" height="46" rx="8"/>
  <text class="t" x="496" y="80">Proxy</text>
  <text class="s" x="496" y="95">any other host</text>

  <path class="flow" d="M72,106 V118 H496 V106 M178,106 V118 M284,106 V118 M390,106 V118"/>
  <path class="flow" d="M284,118 V138" marker-end="url(#sd-ah)"/>
  <text class="a" x="294" y="132" style="text-anchor:start">every host maps onto four calls</text>

  <!-- ONLINE: runtime -->
  <text class="row mono" x="24" y="132">runtime/</text>
  <rect class="box" x="24" y="138" width="520" height="28" rx="8"/>
  <text class="api mono" x="284" y="156">prepare · observe · end_run · expand</text>

  <rect class="box" x="24" y="176" width="166" height="46" rx="8"/>
  <text class="t" x="107" y="196">Thread state store</text>
  <text class="s" x="107" y="211">recipes, calibration, plans</text>
  <rect class="box" x="201" y="176" width="166" height="46" rx="8"/>
  <text class="t" x="284" y="196">Ping scheduler</text>
  <text class="s" x="284" y="211">sends keep-warm requests</text>
  <rect class="box" x="378" y="176" width="166" height="46" rx="8"/>
  <text class="t" x="461" y="196">Telemetry</text>
  <text class="s" x="461" y="211">content-free log</text>

  <!-- ONLINE: core -->
  <rect class="grp" x="16" y="232" width="536" height="100" rx="10"/>
  <text class="row mono" x="24" y="248">core/</text>
  <text class="row-s" x="60" y="248">pure functions, no dependencies</text>
  <rect class="box" x="24" y="262" width="121" height="60" rx="8"/>
  <text class="t" x="84.5" y="282">Gate</text>
  <text class="s" x="84.5" y="297">window · sizing</text>
  <text class="s" x="84.5" y="310">tiers · view</text>
  <rect class="box" x="157" y="262" width="121" height="60" rx="8"/>
  <text class="t" x="217.5" y="282">Planner</text>
  <text class="s" x="217.5" y="297">expected-value rule</text>
  <text class="s" x="217.5" y="310">over ping counts</text>
  <rect class="box" x="290" y="262" width="121" height="60" rx="8"/>
  <text class="t" x="350.5" y="282">View identity</text>
  <text class="s" x="350.5" y="297">fingerprints,</text>
  <text class="s" x="350.5" y="310">prefix transitions</text>
  <rect class="box" x="423" y="262" width="121" height="60" rx="8"/>
  <text class="t" x="483.5" y="282">Ruler</text>
  <text class="s" x="483.5" y="297">calibrated</text>
  <text class="s" x="483.5" y="310">token estimate</text>

  <!-- ONLINE: providers -->
  <text class="row mono" x="24" y="352">providers/</text>
  <text class="row-s" x="90" y="352">wire to parts, breakpoints, usage, keep-warm</text>
  <rect class="box" x="24" y="366" width="166" height="46" rx="8"/>
  <text class="t" x="107" y="386">Anthropic</text>
  <text class="s" x="107" y="401">breakpoints, write premium</text>
  <rect class="box" x="201" y="366" width="166" height="46" rx="8"/>
  <text class="t" x="284" y="386">OpenAI</text>
  <text class="s" x="284" y="401">breakpoints or automatic</text>
  <rect class="box" x="378" y="366" width="166" height="46" rx="8"/>
  <text class="t" x="461" y="386">Gemini</text>
  <text class="s" x="461" y="401">implicit or stored cache</text>

  <path class="flow" d="M284,412 V440" marker-end="url(#sd-ah)"/>
  <rect class="ext" x="24" y="440" width="520" height="34" rx="8"/>
  <text class="s" x="284" y="461" style="font-size:11px">provider APIs and their prompt caches</text>

  <!-- OFFLINE -->
  <rect class="ext" x="612" y="44" width="264" height="32" rx="8"/>
  <text class="s" x="744" y="64" style="font-size:11px">Langfuse · MLflow · OTel · SQL</text>
  <path class="flow" d="M744,76 V112" marker-end="url(#sd-ah)"/>

  <text class="row mono" x="612" y="106">traces/</text>
  <rect class="box" x="612" y="112" width="264" height="46" rx="8"/>
  <text class="t" x="744" y="132">Connectors and audit</text>
  <text class="s" x="744" y="147">normalized record, prefix breaks, cost</text>

  <path class="flow" d="M676,158 V194" marker-end="url(#sd-ah)"/>
  <path class="flow" d="M812,158 V194" marker-end="url(#sd-ah)"/>

  <text class="row mono" x="612" y="188">fit/</text>
  <rect class="box" x="612" y="194" width="128" height="46" rx="8"/>
  <text class="t" x="676" y="214" style="font-size:12px">Cadence fitter</text>
  <text class="s" x="676" y="229">when threads return</text>
  <rect class="box" x="748" y="194" width="128" height="46" rx="8"/>
  <text class="t" x="812" y="214" style="font-size:12px">Dependency fitter</text>
  <text class="s" x="812" y="229">what turns reuse</text>

  <path class="flow" d="M676,240 V264" marker-end="url(#sd-ah)"/>
  <path class="flow" d="M812,240 V264" marker-end="url(#sd-ah)"/>
  <rect class="pill" x="650" y="264" width="188" height="26" rx="13"/>
  <text class="a" x="744" y="281">profile: the workload</text>

  <path class="flow" d="M744,290 V318" marker-end="url(#sd-ah)"/>
  <text class="row mono" x="612" y="312">solve/</text>
  <rect class="box" x="612" y="318" width="166" height="46" rx="8"/>
  <text class="t" x="695" y="338">Solver</text>
  <text class="s" x="695" y="353">replays threads through core/</text>
  <rect class="pill" x="800" y="329" width="76" height="24" rx="12"/>
  <text class="a" x="838" y="345">model spec</text>
  <path class="flow" d="M800,341 H778" marker-end="url(#sd-ah)"/>

  <path class="flow" d="M744,364 V394" marker-end="url(#sd-ah)"/>
  <rect class="policy" x="650" y="394" width="188" height="30" rx="15"/>
  <text class="t" x="744" y="413.5">policy: every knob</text>
  <text class="s" x="744" y="442">read by the gate and the planner</text>

  <!-- bridges between the lanes -->
  <path class="flow" d="M612,341 H584 V276 H552" marker-end="url(#sd-ah)"/>
  <path class="pflow" d="M650,409 H570 V312 H552" marker-end="url(#sd-ahp)"/>
  <path class="tele" d="M544,199 H578 V135 H612" marker-end="url(#sd-aht)"/>

  <!-- contracts under both lanes -->
  <rect class="box" x="8" y="504" width="884" height="44" rx="10"/>
  <text class="tl" x="24" y="530.5">Contracts</text>
  <text class="row mono" x="98" y="530.5">spec/</text>
  <text class="sl" x="140" y="530.5" style="font-size:11px">typed parts · trace record · model spec table · profile and policy schemas · defaults</text>

  <!-- phase badges: the number is the phase that builds the part -->
  <g>
    <circle class="bdg" cx="116" cy="62" r="8.5"/><text class="bdg-t" x="116" y="65.5">1</text>
    <circle class="bdg" cx="222" cy="62" r="8.5"/><text class="bdg-t" x="222" y="65.5">3</text>
    <circle class="bdg" cx="328" cy="62" r="8.5"/><text class="bdg-t" x="328" y="65.5">4</text>
    <circle class="bdg" cx="434" cy="62" r="8.5"/><text class="bdg-t" x="434" y="65.5">4</text>
    <circle class="bdg" cx="540" cy="62" r="8.5"/><text class="bdg-t" x="540" y="65.5">4</text>
    <circle class="bdg" cx="186" cy="178" r="8.5"/><text class="bdg-t" x="186" y="181.5">3</text>
    <circle class="bdg" cx="363" cy="178" r="8.5"/><text class="bdg-t" x="363" y="181.5">3</text>
    <circle class="bdg" cx="540" cy="178" r="8.5"/><text class="bdg-t" x="540" y="181.5">1</text>
    <circle class="bdg" cx="141" cy="264" r="8.5"/><text class="bdg-t" x="141" y="267.5">2</text>
    <circle class="bdg" cx="274" cy="264" r="8.5"/><text class="bdg-t" x="274" y="267.5">2</text>
    <circle class="bdg" cx="407" cy="264" r="8.5"/><text class="bdg-t" x="407" y="267.5">1</text>
    <circle class="bdg" cx="540" cy="264" r="8.5"/><text class="bdg-t" x="540" y="267.5">2</text>
    <circle class="bdg" cx="186" cy="368" r="8.5"/><text class="bdg-t" x="186" y="371.5">1</text>
    <circle class="bdg" cx="363" cy="368" r="8.5"/><text class="bdg-t" x="363" y="371.5">1</text>
    <circle class="bdg" cx="540" cy="368" r="8.5"/><text class="bdg-t" x="540" y="371.5">4</text>
    <circle class="bdg" cx="872" cy="114" r="8.5"/><text class="bdg-t" x="872" y="117.5">1</text>
    <circle class="bdg" cx="736" cy="196" r="8.5"/><text class="bdg-t" x="736" y="199.5">2</text>
    <circle class="bdg" cx="872" cy="196" r="8.5"/><text class="bdg-t" x="872" y="199.5">2</text>
    <circle class="bdg" cx="774" cy="320" r="8.5"/><text class="bdg-t" x="774" y="323.5">2</text>
    <circle class="bdg" cx="880" cy="506" r="8.5"/><text class="bdg-t" x="880" y="509.5">0</text>
  </g>

  <!-- build plan -->
  <text class="lane-t" x="16" y="573">BUILD PLAN</text>
  <text class="lane-s" x="102" y="573">each number marks the phase that builds the part</text>
  <text class="lane-s" x="884" y="573" style="text-anchor:end">nothing touches live traffic before phase 3</text>

  <rect class="box" x="8" y="582" width="170" height="44" rx="10"/>
  <circle class="bdg" cx="28" cy="604" r="9.5"/><text class="bdg-t" x="28" y="607.5">0</text>
  <text class="tl" x="46" y="600">Contracts</text>
  <text class="sl" x="46" y="615">schemas round-trip</text>

  <rect class="box" x="186.5" y="582" width="170" height="44" rx="10"/>
  <circle class="bdg" cx="206.5" cy="604" r="9.5"/><text class="bdg-t" x="206.5" y="607.5">1</text>
  <text class="tl" x="224.5" y="600">See</text>
  <text class="sl" x="224.5" y="615">audit on real traces</text>

  <rect class="box" x="365" y="582" width="170" height="44" rx="10"/>
  <circle class="bdg" cx="385" cy="604" r="9.5"/><text class="bdg-t" x="385" y="607.5">2</text>
  <text class="tl" x="403" y="600">Decide</text>
  <text class="sl" x="403" y="615">a policy and its saving</text>

  <rect class="box" x="543.5" y="582" width="170" height="44" rx="10"/>
  <circle class="bdg" cx="563.5" cy="604" r="9.5"/><text class="bdg-t" x="563.5" y="607.5">3</text>
  <text class="tl" x="581.5" y="600">Act</text>
  <text class="sl" x="581.5" y="615">runs on live traffic</text>

  <rect class="box" x="722" y="582" width="170" height="44" rx="10"/>
  <circle class="bdg" cx="742" cy="604" r="9.5"/><text class="bdg-t" x="742" y="607.5">4</text>
  <text class="tl" x="760" y="600">Broaden</text>
  <text class="sl" x="760" y="615">every host conforms</text>
</svg>
