<svg xmlns="http://www.w3.org/2000/svg" width="880" height="208" viewBox="0 0 880 208" role="img" aria-labelledby="t d">
<title id="t">How compache works: record, fit, apply</title>
<desc id="d">Recorded threads with timestamps and labels for a sample of turns go into compache fit, which replays every candidate policy against the cache. The result is a policy file that says what stays in view and how many keep-warm pings to send, applied on every request without a model call.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#0b0b0b}
.surface{fill:#fcfcfb;stroke:rgba(11,11,11,.1)}
.t2{fill:#52514e}.tm{fill:#898781}.b{font-weight:600}.h{font-size:13px;font-weight:600}.big{font-size:15px;font-weight:600}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.box{fill:none;stroke:#c3c2b7}
.c{fill:#2a78d6}.cs{stroke:#2a78d6}.n{fill:#898781}.ns{stroke:#898781}.o{fill:#eb6834}.os{stroke:#eb6834}
.cell{fill:#e1e0d9}.ring{stroke:#fcfcfb;stroke-width:2}.line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arc{fill:none;stroke-width:1.75;stroke-linecap:round}
@media (prefers-color-scheme:dark){
text{fill:#f0efec}.surface{fill:#1a1a19;stroke:rgba(255,255,255,.1)}.t2{fill:#c3c2b7}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}.box{stroke:#52514e}
.c{fill:#3987e5}.cs{stroke:#3987e5}.o{fill:#d95926}.os{stroke:#d95926}
.cell{fill:#383835}.ring{stroke:#1a1a19}
}
</style>
<rect class="surface" x=".5" y=".5" width="879" height="207" rx="10"/>
<text x="24.0" y="32.0" class="big">Fit once on recorded threads, apply on every request</text>
<rect class="box" x="24" y="58" width="252" height="118" rx="8"/>
<text x="42.0" y="86.0" class="tm b">1  Record</text>
<text x="42.0" y="112.0" class="big">Your threads</text>
<text x="42.0" y="136.0" class="t2">each message with its time</text>
<text x="42.0" y="153.0" class="t2">labels for a sample of turns</text>
<path class="line cs" d="M284,117 h22 m-6,-6 l6,6 l-6,6"/>
<rect class="box" x="314" y="58" width="252" height="118" rx="8"/>
<text x="332.0" y="86.0" class="tm b">2  Fit</text>
<text x="332.0" y="112.0" class="big">compache fit</text>
<text x="332.0" y="136.0" class="t2">replays every candidate policy</text>
<text x="332.0" y="153.0" class="t2">against the cache at your timestamps</text>
<path class="line cs" d="M574,117 h22 m-6,-6 l6,6 l-6,6"/>
<rect class="box" x="604" y="58" width="252" height="118" rx="8"/>
<text x="622.0" y="86.0" class="tm b">3  Apply</text>
<text x="622.0" y="112.0" class="big">policy.json</text>
<text x="622.0" y="136.0" class="t2">what stays in view, per kind of part</text>
<text x="622.0" y="153.0" class="t2">how many pings keep the cache warm</text>
<text x="24.0" y="196.0" class="tm">compache decides what each request holds and when a ping is due. Your application sends the requests and the pings.</text>
</svg>
