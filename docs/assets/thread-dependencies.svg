<svg xmlns="http://www.w3.org/2000/svg" width="880" height="294" viewBox="0 0 880 294" role="img" aria-labelledby="t d">
<title id="t">What each turn of one conversation needed from earlier turns</title>
<desc id="d">A 30-turn conversation drawn as three lanes: questions, retrieved text and answers. 8 turns need an earlier part. For 6 of them that part is still in view under the fitted policy, which keeps questions and answers for a long time and retrieved text for one turn. The other 2 fetch it back.</desc>
