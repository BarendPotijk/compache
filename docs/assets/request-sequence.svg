    .lane-s { font-size: 11px; fill: #656d76; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.25; }
    .t { font-size: 12.5px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
    .s { font-size: 10px; fill: #656d76; text-anchor: middle; }
    .life { stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 3 4; }
    .act { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .call { fill: none; stroke: #424a53; stroke-width: 1.4; }
    .ret { fill: none; stroke: #6e7781; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dec { fill: none; stroke: #2a78d6; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .h-call { fill: #424a53; } .h-ret { fill: #6e7781; } .h-dec { fill: #2a78d6; }
    .lab { font-size: 11px; fill: #1f2328; text-anchor: middle; paint-order: stroke; stroke: #f6f8fa; stroke-width: 5px; stroke-linejoin: round; }
    .lab.code { font-size: 10px; }
    .lab.left { text-anchor: start; }
    .loop { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 2 3; }
    .bdg { fill: #1f2328; }
    .bdg-t { font-size: 9.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .key { font-size: 10.5px; fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .band { fill: #161b22; }
      .tab { fill: #21262d; }
      .lane-t, .t { fill: #e6edf3; }
      .lane-s, .s, .key { fill: #9198a1; }
      .box { fill: #0d1117; stroke: #30363d; }
      .life { stroke: #484f58; }
      .act { fill: #0d1117; stroke: #6e7681; }
      .call { stroke: #c9d1d9; } .h-call { fill: #c9d1d9; }
      .ret { stroke: #8b949e; } .h-ret { fill: #8b949e; }
      .dec { stroke: #3987e5; } .h-dec { fill: #3987e5; }
      .lab { fill: #e6edf3; stroke: #161b22; }
      .loop { stroke: #6e7681; }
      .bdg { fill: #e6edf3; }
      .bdg-t { fill: #0d1117; }
    }
</style>
