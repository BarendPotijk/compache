<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-labelledby="seq-title seq-desc">
<title id="seq-title">One request through compache</title>
<desc id="seq-desc">Sequence diagram. Before every request the integration calls prepare: the runtime loads state, the provider adapter turns the request into typed parts, the gate returns a recipe and a view, and the adapter renders the provider request, which the integration sends. After the response the integration calls observe, which reads the bill and calibrates. At run end the planner decides whether to ping, and pings repeat while the thread is idle.</desc>
