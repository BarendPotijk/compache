<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Explore Compache and OpenClaw cost scenarios</title><desc id="desc">Set model, retrieval size, dependencies and return behavior. Compare deterministic costs with transparent assumptions.</desc><rect width="1200" height="400" rx="20" fill="#f4f7ef"/><g font-family="Arial,sans-serif"><text x="52" y="65" font-size="16" letter-spacing="3" fill="#216751">COMPACHE / COST EXPLORER</text><text x="52" y="132" font-size="43" font-weight="bold" fill="#18342f">Compaction &amp; caching.</text><text x="52" y="184" font-size="43" font-weight="bold" fill="#18342f">One workload. Two policies.</text><text x="52" y="231" font-size="18" fill="#61736d">Cost per run · context over time · cache hit rate</text><rect x="52" y="276" width="274" height="54" rx="8" fill="#216751"/><text x="77" y="310" font-size="18" fill="white">Open the interactive explorer ↗</text><text x="52" y="366" font-size="13" fill="#61736d">Scenario estimates with visible assumptions. No API key required.</text><rect x="729" y="48" width="414" height="300" rx="14" fill="white" stroke="#dce2db"/><text x="758" y="89" font-size="17" fill="#18342f">Same workload. Two policies.</text><path d="M765 125H1104M765 168H1104M765 211H1104M765 254H1104" stroke="#edf0ea"/><path d="M765 249L820 210L875 159L895 238L950 198L1005 145L1025 237L1100 189" stroke="#216751" stroke-width="4" fill="none"/><path d="M765 249L820 213L875 174L930 130L985 102L1005 248L1100 205" stroke="#ba7247" stroke-width="3" fill="none"/><circle cx="772" cy="299" r="5" fill="#216751"/><text x="786" y="304" font-size="14" fill="#61736d">Compache</text><circle cx="917" cy="299" r="5" fill="#ba7247"/><text x="931" y="304" font-size="14" fill="#61736d">OpenClaw</text></g></svg>
