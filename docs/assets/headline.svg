<svg xmlns="http://www.w3.org/2000/svg" width="880" height="182" viewBox="0 0 880 182" role="img" aria-labelledby="t d">
<title id="t">46% off the bill, with as many answers right</title>
<desc id="d">Live calls to Claude Haiku 5.5. Billed per 1,000 user messages: $2.68 without compache, $1.45 with. Answers graded right of 208: 125 without, 135 with.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:#0b0b0b}
.surface{fill:#fcfcfb;stroke:rgba(11,11,11,.1)}
.t2{fill:#52514e}.tm{fill:#898781}.b{font-weight:600}.h{font-size:13px;font-weight:600}.big{font-size:15px;font-weight:600}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.box{fill:none;stroke:#c3c2b7}
.c{fill:#2a78d6}.cs{stroke:#2a78d6}.n{fill:#898781}.ns{stroke:#898781}.o{fill:#eb6834}.os{stroke:#eb6834}
.cell{fill:#e1e0d9}.ring{stroke:#fcfcfb;stroke-width:2}.line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arc{fill:none;stroke-width:1.75;stroke-linecap:round}
@media (prefers-color-scheme:dark){
text{fill:#f0efec}.surface{fill:#1a1a19;stroke:rgba(255,255,255,.1)}.t2{fill:#c3c2b7}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}.box{stroke:#52514e}
.c{fill:#3987e5}.cs{stroke:#3987e5}.o{fill:#d95926}.os{stroke:#d95926}
.cell{fill:#383835}.ring{stroke:#1a1a19}
}
</style>
<rect class="surface" x=".5" y=".5" width="879" height="181" rx="10"/>
<text x="24.0" y="32.0" class="big">46% off the bill, with as many answers right</text>
<text x="24.0" y="51.0" class="t2">Live calls to Claude Haiku 5.5, billed by the provider: 52 messages compache had not seen, each through 4 integrations.</text>
<text x="124.0" y="130.0" class="t2" text-anchor="end">Without</text>
<text x="124.0" y="162.0" class="b" text-anchor="end">With compache</text>
<text x="138.0" y="97.0" class="h">Bill per 1,000 user messages</text>
<line class="axis" x1="138" x2="138" y1="110" y2="172"/>
<path class="n" d="M138,114 h256.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-256.0 z"/>
<text x="406.0" y="129.5" class="t2">$2.68</text>
<path class="c" d="M138,146 h136.4 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-136.4 z"/>
<text x="286.4" y="161.5" class="h">$1.45</text>
<text x="538.0" y="97.0" class="h">Right answers, out of 208</text>
<line class="axis" x1="538" x2="538" y1="110" y2="172"/>
<path class="n" d="M538,114 h236.7 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-236.7 z"/>
<text x="786.7" y="129.5" class="t2">125</text>
<path class="c" d="M538,146 h256.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-256.0 z"/>
<text x="806.0" y="161.5" class="h">135</text>
