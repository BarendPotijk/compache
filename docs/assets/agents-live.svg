<title id="t">Long Claude Code sessions cost far less with compache</title>
<desc id="d">The bill so far, after each prompt, on Claude Haiku 5.5. A line averages two runs, its band shows both. Headroom and Kompressor: one run. One task, 13 prompts, after prompt 13: alone $0.33, Headroom $0.40, Kompressor $0.28, compache $0.13. 16 issues in one conversation, after prompt 16: alone $0.98, compache $0.15.</desc>
